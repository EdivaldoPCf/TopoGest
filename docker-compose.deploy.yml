x-app: &app
  image: topogest-app:${IMAGE_TAG:?IMAGE_TAG is required}
  build:
    context: .
    dockerfile: Dockerfile
    target: app
    args:
      VITE_APP_NAME: ${APP_NAME:-TopoGest}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
  env_file:
    - ${ENV_FILE:?ENV_FILE is required}
  restart: unless-stopped
  volumes:
    - storage_data:/var/www/html/storage
  networks:
    - backend
  depends_on:
    db:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true

services:
  db:
    container_name: ${CONTAINER_PREFIX:?CONTAINER_PREFIX is required}-db
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    command: php artisan migrate --force --no-interaction

  test:
    image: topogest-test:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: .
      dockerfile: Dockerfile
      target: test
      args:
        VITE_APP_NAME: ${APP_NAME:-TopoGest}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
    profiles: ["tools"]
    env_file:
      - ${ENV_FILE:?ENV_FILE is required}
    environment:
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ASSET_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/topogest-tests.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    command: php artisan test
    network_mode: none
    restart: "no"
    security_opt:
      - no-new-privileges:true

  app:
    <<: *app
    container_name: ${CONTAINER_PREFIX:?CONTAINER_PREFIX is required}-app
    command: php-fpm
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5

  queue:
    <<: *app
    container_name: ${CONTAINER_PREFIX:?CONTAINER_PREFIX is required}-queue
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120 --no-interaction
    stop_grace_period: 30s

  scheduler:
    <<: *app
    container_name: ${CONTAINER_PREFIX:?CONTAINER_PREFIX is required}-scheduler
    command: php artisan schedule:work --no-interaction
    stop_grace_period: 30s

  reverb:
    <<: *app
    container_name: ${CONTAINER_PREFIX:?CONTAINER_PREFIX is required}-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    expose:
      - "8080"
    stop_grace_period: 30s

  web:
    container_name: ${CONTAINER_PREFIX:?CONTAINER_PREFIX is required}-web
    image: topogest-web:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_APP_NAME: ${APP_NAME:-TopoGest}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
    restart: unless-stopped
    ports:
      - "${PUBLISH_IP:?PUBLISH_IP is required}:80:80"
    volumes:
      - storage_data:/var/www/html/storage:ro
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/topogest/up"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
  storage_data:

networks:
  backend:
