services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: topogest_app
    container_name: topogest_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: topogest
      DB_USERNAME: topogest
      DB_PASSWORD: secret
    volumes:
      - ./:/var/www/html:delegated
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - ./.env.docker:/var/www/html/.env:ro
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      - db

  web:
    image: nginx:stable-alpine
    container_name: topogest_web
    restart: unless-stopped
    ports:
      - "25565:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:11.2
    container_name: topogest_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: topogest
      MARIADB_USER: topogest
      MARIADB_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  vendor:
  node_modules:
  db_data: