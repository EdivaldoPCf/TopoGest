<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopoGest Tray</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { border-radius: 12px; overflow: hidden; background: transparent; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-white h-screen flex flex-col font-sans text-gray-800 shadow-2xl border border-gray-200">

    <!-- Header -->
    <div class="h-16 bg-white flex items-center justify-between px-5 border-b border-gray-100">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center font-bold text-white text-sm shadow-sm">T</div>
            <span class="font-bold text-gray-800 tracking-wide text-lg">Drive</span>
        </div>
        <div class="flex gap-1 text-gray-400">
            <button class="p-2 hover:bg-gray-100 hover:text-gray-600 rounded-full transition" title="Configurações">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            </button>
        </div>
    </div>

    <!-- Status Area -->
    <div class="px-5 py-4 flex items-center gap-4 bg-gray-50 border-b border-gray-100">
        <div class="w-10 h-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
        </div>
        <div>
            <h3 class="font-semibold text-gray-800">Tudo Atualizado</h3>
            <p class="text-xs text-gray-500">Monitorando pastas do TopoGest...</p>
        </div>
    </div>

    <!-- Activity List -->
    <div class="flex-1 overflow-y-auto bg-white p-2">
        <div id="syncList" class="space-y-1">
            <div class="p-6 text-center text-gray-400 text-sm">
                Nenhuma atividade recente.
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="p-3 bg-gray-50 border-t border-gray-100">
        <button id="btnOpenDashboard" class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-white border border-gray-200 hover:bg-gray-100 rounded-lg text-sm font-semibold text-gray-700 shadow-sm transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
            Abrir Painel Completo
        </button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        document.getElementById('btnOpenDashboard').addEventListener('click', () => {
            ipcRenderer.send('open-dashboard');
        });

        ipcRenderer.on('sync-progress', (event, data) => {
            const list = document.getElementById('syncList');
            if (list.innerHTML.includes('Nenhuma atividade recente')) {
                list.innerHTML = '';
            }

            const itemId = 'file-' + btoa(data.file).replace(/[^a-zA-Z0-9]/g, '');
            let item = document.getElementById(itemId);

            if (!item) {
                item = document.createElement('div');
                item.id = itemId;
                item.className = 'flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg transition';
                list.prepend(item);
            }

            item.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
                    </div>
                    <div class="truncate">
                        <p class="text-sm font-semibold text-gray-800 truncate">${data.file}</p>
                        <p class="text-xs text-gray-500">${data.status}</p>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
